[project]
name = "ipm-solver"
version = "0.1.0"
description = "Interior point solver for linear and convex quadratic programs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "scikit-learn"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ipm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
